name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      CONFIG: Release

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen (if project.yml present)
        run: |
          if [ -f project.yml ]; then
            brew install xcodegen
            xcodegen generate
          else
            echo "No project.yml found, skipping xcodegen"
          fi

      - name: Discover project/workspace/scheme
        id: discover
        run: |
          set -e
          if ls *.xcworkspace >/dev/null 2>&1; then
            WORKSPACE=$(ls -d *.xcworkspace | head -n1)
            echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
            LIST_ARGS="-workspace $WORKSPACE"
          elif ls *.xcodeproj >/dev/null 2>&1; then
            PROJECT=$(ls -d *.xcodeproj | head -n1)
            echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
            LIST_ARGS="-project $PROJECT"
          else
            echo "::error::No .xcodeproj or .xcworkspace found after checkout/xcodegen. Repo layout may differ from expected."
            find . -maxdepth 2 -iname "*.xcodeproj" -o -iname "*.xcworkspace" -o -iname "project.yml"
            exit 1
          fi

          SCHEME=$(xcodebuild -list $LIST_ARGS -json | jq -r 'if has("workspace") then .workspace.schemes[0] else .project.schemes[0] end')
          if [ -z "$SCHEME" ] || [ "$SCHEME" = "null" ]; then
            echo "::error::No scheme found via xcodebuild -list"
            exit 1
          fi
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Discovered: $LIST_ARGS, scheme=$SCHEME"

      - name: Build unsigned .app
        run: |
          set -e
          BUILD_DIR="$(mktemp -d)"
          echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"

          if [ -n "${{ steps.discover.outputs.workspace }}" ]; then
            PROJ_ARGS="-workspace ${{ steps.discover.outputs.workspace }}"
          else
            PROJ_ARGS="-project ${{ steps.discover.outputs.project }}"
          fi

          xcodebuild $PROJ_ARGS \
            -scheme "${{ steps.discover.outputs.scheme }}" \
            -sdk iphoneos -configuration "$CONFIG" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -derivedDataPath "$BUILD_DIR" build

      - name: Package into unsigned IPA
        run: |
          set -e
          APP=$(find "$BUILD_DIR/Build/Products/$CONFIG-iphoneos" -maxdepth 1 -name "*.app" | head -n1)
          [ -d "$APP" ] || { echo "::error::no .app found under $BUILD_DIR/Build/Products/$CONFIG-iphoneos"; exit 1; }

          APP_NAME=$(basename "$APP" .app)
          STAGE="$BUILD_DIR/stage"
          mkdir -p "$STAGE/Payload" output
          cp -R "$APP" "$STAGE/Payload/"
          ( cd "$STAGE" && zip -qry "$GITHUB_WORKSPACE/output/${APP_NAME}-unsigned.ipa" Payload )
          echo "Built: output/${APP_NAME}-unsigned.ipa"
          ls -lh output/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: output/*.ipa
          retention-days: 14
